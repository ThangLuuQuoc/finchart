<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>candlekit stress test — 50k real bars</title>
    <style>
      body { margin: 0; background: #0e1117; color: #e5e7eb; font: 13px/1.5 ui-monospace, Consolas, monospace; }
      #layout { display: flex; height: 100vh; }
      #chart { flex: 1; min-width: 0; }
      #panel { width: 380px; overflow-y: auto; padding: 12px; border-left: 1px solid #1f2937; box-sizing: border-box; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
      td, th { border: 1px solid #1f2937; padding: 3px 6px; text-align: right; }
      td:first-child, th:first-child { text-align: left; }
      .phase { color: #facc15; }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      #status { margin-bottom: 8px; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="chart"></div>
      <div id="panel">
        <h1>candlekit stress — 50k bars BTCUSDT 15m</h1>
        <div id="status">loading…</div>
        <div id="results"></div>
        <pre id="json"></pre>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
